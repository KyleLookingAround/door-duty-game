<style>
/* Layout: one column console — street ledger of client plots; full-screen workshop with plan canvas, slot editor and a sticky action bar */
:root {
  --ink: #12151b;
  --panel: #1b2029;
  --raised: #222833;
  --line: #2e3542;
  --brass: #d4a94f;
  --frost: #9cc4ec;
  --rose: #e79a86;
  --warn: #ef5b4c;
  --ok: #6fcf97;
  --dizzy: #b48cf0;
  --text: #ece6d8;
  --mute: #8d93a0;
  --f-display: "Limelight", "Didot", Georgia, serif;
  --f-body: "Figtree", system-ui, -apple-system, sans-serif;
  --f-mono: "DM Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
body { background: var(--ink); color: var(--text); font-family: var(--f-body); -webkit-tap-highlight-color: transparent; }
.wrap {
  max-width: 560px; margin: 0 auto; box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 96px; display: grid; gap: 14px;
}
button { font-family: var(--f-body); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* top bar */
.top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); color: var(--brass); font-size: 22px; line-height: 1; flex: 1; min-width: 0; }
.brand small { display: block; font-family: var(--f-body); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); margin-top: 4px; }
.stats { display: flex; gap: 6px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; text-align: right; }
.stat b { display: block; font: 500 14px var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.fsbtn { color: var(--mute); cursor: pointer; display: grid; place-items: center; padding: 5px 8px; }
.fsbtn:hover { color: var(--brass); }
.stat span { display: block; font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }

.secthead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.secthead h2 { font-family: var(--f-display); font-weight: 400; font-size: 24px; margin: 0; }
.secthead span { font-size: 12px; color: var(--mute); }

/* street */
.street { display: grid; gap: 8px; position: relative; }
.plot {
  display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; text-align: left; width: 100%;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; color: var(--text); cursor: pointer;
}
.plot:hover:not(:disabled) { border-color: var(--brass); }
.plot:disabled { cursor: default; }
.plot.locked { opacity: .5; }
.plot .name { font-weight: 700; font-size: 15px; }
.plot .kind { font-size: 12px; color: var(--mute); }
.plot .stline { font-size: 12px; margin-top: 3px; color: var(--mute); }
.plot .stline b { color: var(--text); font-weight: 600; }
.pill { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 5px 9px; border-radius: 99px; white-space: nowrap; }
.pill.open { background: var(--brass); color: #1d1608; }
.pill.call { background: var(--warn); color: #1a0a08; }
.pill.done { border: 1px solid var(--line); color: var(--brass); letter-spacing: 2px; }
.pill.lock { border: 1px dashed var(--line); color: var(--mute); }
.front { display: flex; gap: 3px; height: 40px; align-items: end; padding: 4px; background: var(--ink); border-radius: 8px; border: 1px solid var(--line); }
.front i { flex: 1; height: 100%; border-radius: 3px; background: #262c37; position: relative; }
.front i.r::after { content: ""; position: absolute; inset: 20% 10%; border: 2px solid var(--brass); border-radius: 50%; }
.front i.s::after { content: ""; position: absolute; left: 20%; right: 20%; bottom: 25%; height: 2px; background: var(--frost); transform: rotate(-28deg); transform-origin: left; }
.front i.l::after { content: ""; position: absolute; left: 12%; right: 12%; bottom: 30%; height: 3px; border-left: 6px solid var(--frost); border-right: 6px solid var(--frost); box-sizing: border-box; }
.front i.g::after { content: ""; position: absolute; left: 14%; right: 14%; bottom: 22%; height: 40%; border-left: 3px solid #6b7380; border-right: 3px solid #6b7380; box-shadow: inset 0 -2px 0 var(--brass); }
.front i.empty { background: repeating-linear-gradient(135deg, #1b2029 0 4px, #232933 4px 8px); }

.cal { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.calm { border: 1px solid var(--line); border-radius: 10px; padding: 7px 9px; background: var(--panel); min-width: 0; }
.calm span { display: block; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
.calm b { display: block; font-size: 13px; font-weight: 600; color: var(--mute); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.calm.ev b { color: var(--text); }
.calm.now { border-color: var(--brass); }
.calm.now.ev b { color: var(--brass); }
.mapbox { border: 1px solid var(--line); border-radius: 14px; overflow-x: auto; overflow-y: hidden; background: #151a21; scrollbar-width: thin; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }
.scene { display: block; font-family: var(--f-body); }
.scene .sc-sign { font-size: 10px; font-weight: 700; letter-spacing: .16em; }
.scene .sc-pill { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; }
.scene .sc-tag { fill: #fff; font-size: 10px; font-weight: 700; letter-spacing: .12em; }
.scene .sc-need { font-size: 10.5px; font-weight: 600; }
.scene .sc-small { fill: #ece6d8; font-size: 8px; font-weight: 700; letter-spacing: .14em; }
.scene .sbld[role=button] { cursor: pointer; }
.scene .sbld[role=button]:hover > rect:first-child, .scene .sbld:focus-visible > rect:first-child { filter: brightness(1.18); }
.scene .sbld:focus { outline: none; }
.scene .sbld.locked { filter: saturate(.45) brightness(.7); }
.scene .walker.right { animation: walkR linear infinite; }
.scene .walker.left { animation: walkL linear infinite; }
@keyframes walkR { from { transform: translateX(-30px); } to { transform: translateX(var(--sw)); } }
@keyframes walkL { from { transform: translateX(var(--sw)); } to { transform: translateX(-30px); } }
.scene .fall { animation: fall linear infinite; }
@keyframes fall { from { transform: translate(0, 0); } to { transform: translate(-30px, 340px); } }
.scene .pour { animation: pour linear infinite; }
@keyframes pour { from { transform: translate(0, 0); } to { transform: translate(-40px, 340px); } }
.scene .leaf { animation: leaf linear infinite; }
@keyframes leaf { 0% { transform: translate(0, 0) rotate(0); } 50% { transform: translate(30px, 170px) rotate(180deg); } 100% { transform: translate(-10px, 340px) rotate(360deg); } }
.scene .wing { animation: wing 2.2s linear infinite; transform-box: view-box; }
@keyframes wing { 0% { transform: scaleX(1); } 50% { transform: scaleX(-1); } 100% { transform: scaleX(1); } }
.scene .twinkle { animation: twinkle 1.6s ease-in-out infinite; }
@keyframes twinkle { 50% { opacity: .25; } }
.scene .glow { animation: twinkle 3s ease-in-out infinite; }
.scene .bob { animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-3px); } }
.scene .flag { animation: flag 1.4s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: left center; }
@keyframes flag { to { transform: scaleX(.75) skewY(6deg); } }
.ledger { display: grid; gap: 10px; }
.ledhead { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); margin-top: 6px; }
.streethint { font-size: 11px; color: var(--mute); margin-top: -8px; }
@media (prefers-reduced-motion: reduce) { .scene * { animation: none !important; } }
.fsbtn { flex: none; width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); cursor: pointer; padding: 0; align-self: center; }
.fsbtn:hover { border-color: var(--brass); color: var(--brass); }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.confetti i { position: absolute; top: -12px; width: 7px; height: 11px; border-radius: 2px; animation: confall ease-in forwards; }
@keyframes confall { to { top: 105%; transform: translateX(40px) rotate(540deg); } }
.scene .justfitted { animation: fitted 0.6s ease-in-out 4; }
@keyframes fitted { 50% { filter: brightness(1.5) drop-shadow(0 0 8px #d4a94f); } }
.wear { height: 8px; border-radius: 4px; background: var(--ink); border: 1px solid var(--line); overflow: hidden; }
.wear i { display: block; height: 100%; }
.coach { position: fixed; inset: 0; pointer-events: none; z-index: 70; }
.coach .ring { position: fixed; border: 2px solid var(--brass); border-radius: 12px; box-shadow: 0 0 0 9999px rgba(8,10,14,.42); transition: all .2s ease; }
.coach .bubble { position: fixed; pointer-events: auto; background: var(--raised); border: 1px solid var(--brass); border-radius: 14px; padding: 12px 14px; box-shadow: 0 10px 30px rgba(0,0,0,.45); display: grid; gap: 6px; box-sizing: border-box; }
.coach .bubble b { color: var(--brass); font-size: 13px; letter-spacing: .04em; }
.coach .bubble p { margin: 0; font-size: 13px; line-height: 1.45; color: var(--text); }
.coach .cbtns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
.small { padding: 7px 11px !important; font-size: 12px !important; flex: 0 0 auto !important; }
.lessonrow { display: flex; justify-content: space-between; align-items: center; width: 100%; text-align: left; background: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; color: var(--text); font: inherit; font-size: 13px; cursor: pointer; margin-top: 6px; }
.lessonrow span { color: var(--brass); }
.learn { display: flex; flex-wrap: wrap; gap: 6px; }
#skipBtn { flex: 0 0 auto; }
.teaser { border: 1px dashed var(--line); border-radius: 12px; padding: 12px; color: var(--mute); font-size: 13px; line-height: 1.5; }
.teaser b { color: var(--text); }

.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; background: linear-gradient(to top, var(--ink) 70%, transparent);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 14px; padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
}
.dock .in { max-width: 560px; margin: 0 auto; display: flex; gap: 8px; }
.go { flex: 1; border: 0; border-radius: 10px; padding: 13px; background: var(--brass); color: #1d1608; font-weight: 700; font-size: 14px; letter-spacing: .05em; text-transform: uppercase; cursor: pointer; }
.go:disabled { opacity: .4; cursor: default; }
.ghost { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--panel); color: var(--text); font-weight: 600; font-size: 13px; cursor: pointer; }
.ghost[aria-pressed=true] { border-color: var(--brass); color: var(--brass); }

/* sheets */
.overlay {
  position: fixed; inset: 0; z-index: 10; background: rgba(10,12,16,.8); backdrop-filter: blur(3px);
  display: flex; align-items: flex-end; justify-content: center;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); padding-top: max(12px, env(safe-area-inset-top, 0px));
}
.sheet { width: 100%; max-width: 520px; max-height: 100%; overflow: auto; box-sizing: border-box; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 14px; }
.sheet h3 { font-family: var(--f-display); font-weight: 400; font-size: 26px; margin: 0; line-height: 1.05; text-wrap: balance; }
.sheet p { margin: 0; color: var(--mute); line-height: 1.5; font-size: 14px; }
.sheet .eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--brass); }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.fact { background: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; min-width: 0; }
.fact b { display: block; font: 500 15px var(--f-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fact span { font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 99px; background: var(--raised); color: var(--text); }
.tag.cold { color: var(--frost); }
.tag.hot { color: var(--warn); }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.list li { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.list li span:last-child { font-family: var(--f-mono); text-align: right; }
.list li.pass span:last-child { color: var(--ok); }
.list li.fail span:last-child { color: var(--warn); }
.progress { height: 6px; border-radius: 99px; background: var(--ink); overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--brass); transition: width .15s; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--mute); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.branch { display: grid; gap: 6px; }
.node { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; background: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.node b { font-size: 14px; }
.node p { font-size: 12px; margin-top: 3px; }
.node.owned { border-color: rgba(212,169,79,.5); }
.node.doing { border-color: var(--brass); border-style: dashed; }
.node.locked { opacity: .55; }
.node .go, .node .ghost { padding: 9px 12px; font-size: 12px; white-space: nowrap; }
.node .opens { color: var(--brass); }
.neg { color: var(--warn) !important; }
.hot { color: var(--warn); }
.rd { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; background: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.rd b { font-size: 14px; }
.rd p { grid-column: 1; font-size: 12px; }
.rd button { grid-row: 1 / span 2; grid-column: 2; }
.stars { font-size: 28px; letter-spacing: 6px; color: var(--brass); }
.stars .off { color: var(--line); }

/* workshop */
.wsbar { display: flex; align-items: center; gap: 8px; min-width: 0; }
.wrap > * { min-width: 0; }
.strip { display: flex; flex-wrap: wrap; gap: 6px; background: transparent; border: 0; padding: 0; text-align: left; cursor: pointer; }
.tag.brass { background: var(--brass); color: #1d1608; }
.ghost.armed { border-color: var(--warn); color: var(--warn); }
.wsbar .ghost { padding: 10px 12px; white-space: nowrap; }
.tag.more { background: transparent; border: 1px solid var(--line); color: var(--mute); }
.wsbar h2 { font-family: var(--f-display); font-weight: 400; font-size: 20px; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stage { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #0e1116; }
.stage canvas { display: block; width: 100%; touch-action: manipulation; }
.hud { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; }
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 6px; min-width: 0; }
.chip b { display: block; font: 500 13px var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip span { display: block; font-size: 8.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); white-space: nowrap; }
.chip.bad b { color: var(--warn); } .chip.good b { color: var(--ok); }
.slots { display: flex; gap: 6px; }
.slotbtn { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 7px 6px; color: var(--text); cursor: pointer; text-align: center; }
.slotbtn b { display: block; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slotbtn span { font: 400 11px var(--f-mono); color: var(--mute); }
.slotbtn[aria-pressed=true] { border-color: var(--brass); box-shadow: inset 0 0 0 1px var(--brass); }
.editor { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 10px; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--ink); border-radius: 10px; padding: 4px; }
.seg.three { grid-template-columns: repeat(3, 1fr); }
.seg.two { grid-template-columns: repeat(2, 1fr); }
.seg button { border: 0; border-radius: 7px; padding: 8px 4px; background: transparent; color: var(--mute); font-weight: 600; font-size: 12px; cursor: pointer; line-height: 1.2; }
.seg button small { display: block; font: 400 10px var(--f-mono); opacity: .8; }
.seg button[aria-pressed=true] { background: var(--raised); color: var(--text); box-shadow: inset 0 0 0 1px var(--brass); }
.row { display: grid; grid-template-columns: 74px 1fr 70px; align-items: center; gap: 10px; }
.row label, .row .lbl { font-size: 11px; color: var(--mute); letter-spacing: .08em; text-transform: uppercase; }
.row output { font: 500 13px var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--brass); height: 28px; margin: 0; }
.stepper { display: flex; gap: 6px; align-items: center; }
.stepper button { width: 34px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--ink); color: var(--text); font-size: 16px; cursor: pointer; }
.stepper button:disabled { opacity: .35; }
.dots { flex: 1; display: flex; gap: 4px; justify-content: center; }
.dots i { width: 6px; height: 14px; border-radius: 2px; background: var(--line); }
.dots i.on { background: var(--brass); }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; }
.toggle small { display: block; color: var(--mute); font-size: 11px; }
.toggle input { width: 20px; height: 20px; accent-color: var(--brass); }
.toggle.locked { opacity: .45; }
.note { font-size: 12px; color: var(--mute); line-height: 1.45; }
.note .hot { color: var(--warn); }
.costbar { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--mute); flex-wrap: wrap; }
.costbar b { font: 500 13px var(--f-mono); color: var(--text); }
.costbar b.over { color: var(--warn); }
.toast {
  position: fixed; left: 50%; top: max(12px, env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 20;
  background: var(--brass); color: #1d1608; font-weight: 700; font-size: 13px; padding: 8px 14px; border-radius: 99px;
  opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis;
}
.toast.show { opacity: 1; } .toast.bad { background: var(--warn); }
@media (prefers-reduced-motion: reduce) { .toast, .progress i { transition: none; } }
</style>

    </div>

</div>

<div id="workshop" class="wrap" hidden>
  <div class="wsbar"><button class="ghost" id="wsBack" type="button">Street</button><h2 id="wsTitle">Lark Café</h2><button class="ghost" id="wsResetBtn" type="button">Reset</button><button class="ghost" id="wsBriefBtn" type="button">Brief</button></div>
  <button class="strip" id="wsStrip" type="button" aria-label="Show the full brief"></button>

<div class="coach" id="coach" hidden><div class="ring" id="coachRing"></div><div class="bubble" id="coachBubble" role="dialog" aria-live="polite"><b id="coachTitle"></b><p id="coachText"></p><div class="cbtns"><button class="ghost small" type="button" id="coachSkip">Skip the walk-through</button><button class="go small" type="button" id="coachOk">Got it</button></div></div></div>
<script id="core">
// ---------- Multi-door entrance simulation (no DOM) ----------
const TAU = Math.PI * 2;
const SLOT_W = 3.0;      // m per frontage slot
const WORLD_HH = 3.6;    // half height
const REV_R = 1.15;      // revolving drum radius
const WIDE_R = 1.42;     // wide-drum revolving door (R&D)
const V_SAFE = 0.75;
const BLADE_T = 0.035, WALL_T = 0.05;

const GUEST = {
  normal:  { r: [0.18, 0.22], walk: [1.1, 1.4], safe: 1.0, react: [0.3, 1.1] },
  elderly: { r: [0.19, 0.22], walk: [0.65, 0.85], safe: 0.6, react: [0.8, 1.8] },
  wheel:   { r: [0.33, 0.35], walk: [0.85, 1.0], safe: 0.8, react: [0.4, 1.0], stepfree: true },
  case:    { r: [0.26, 0.29], walk: [0.95, 1.15], safe: 0.9, react: [0.5, 1.3] },
  pram:    { r: [0.30, 0.33], walk: [0.9, 1.05], safe: 0.8, react: [0.4, 1.0], stepfree: true },   // prams and delivery trolleys
  bike:    { r: [0.28, 0.32], walk: [1.0, 1.2], safe: 1.0, react: [0.4, 0.9], noRevolve: true },  // cyclists wheeling a bike
};
const MIX_TYPES = ['elderly', 'wheel', 'case', 'pram', 'bike'];
// seconds to tap through a ticket gate
const TAP = { normal: 0.9, elderly: 1.8, wheel: 2.0, case: 1.4, pram: 1.8, bike: 2.0 };

// does the segment (x0,y0)-(x1,y1) pass through the box? (slab test)
function segHitsBox(x0, y0, x1, y1, bx0, by0, bx1, by1) {
  let t0 = 0, t1 = 1;
  const dx = x1 - x0, dy = y1 - y0;
  for (const [p, q] of [[-dx, x0 - bx0], [dx, bx1 - x0], [-dy, y0 - by0], [dy, by1 - y0]]) {
    if (p === 0) { if (q < 0) return false; continue; }
    const r = q / p;
    if (p < 0) { if (r > t1) return false; if (r > t0) t0 = r; } else { if (r < t0) return false; if (r < t1) t1 = r; }
  }
  return true;
}
// nearest point on an obstacle to (x, y): circles, rectangles and standing people
function obstacleNearest(o, x, y) {
  if (o.kind === 'rect') {
    const qx = Math.max(o.x0, Math.min(o.x1, x)), qy = Math.max(o.y0, Math.min(o.y1, y));
    return { qx, qy, t: 0 };
  }
  const dx = x - o.x, dy = y - o.y, d = Math.sqrt(dx * dx + dy * dy) || 1e-6;
  return { qx: o.x + dx / d * o.r, qy: o.y + dy / d * o.r, t: 0 };
}

function modT(a) { a %= TAU; return a < 0 ? a + TAU : a; }
function arcOverlap(a0, la, b0, lb) {
  const d = modT(b0 - a0);
  let len = 0, best = null;
  for (const s of [d, d - TAU]) {
    const os = Math.max(0, s), oe = Math.min(la, s + lb);
    if (oe > os) { len += oe - os; if (!best || oe - os > best[1] - best[0]) best = [os, oe]; }
  }
  return { len, mid: best ? a0 + (best[0] + best[1]) / 2 : 0 };
}
function makeRng(seed) {
  let s = (seed >>> 0) || 1;
  return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
}

class World {
  // cfg: { slots:[{type,wings,mouth,core,rpm,padded,curtain}], crowd:{in,out,mix:{elderly,wheel,case}},
  //        outsideTemp, duration, seed, heater, wind, brakes, radar, signs, rain, site }
  // site: { obstacles:[{kind:'circle'|'rect'|'person',...}], rampBays:[i], spawnIn:{x,spread,p}, surge:{every,n,x,spread} }
  // per-door R&D options: sensor (presence-sensing slowdown), wide (wide drum),
  // vestibule (draught lobby on open doors), doorman (staffed door)
  constructor(cfg) {
    this.cfg = cfg;
    this.rng = makeRng(cfg.seed || 7);
    const n = cfg.slots.length;
    this.HW = n * SLOT_W / 2; this.HH = WORLD_HH;
    this.doors = cfg.slots.map((s, i) => {
      const cx = -this.HW + SLOT_W / 2 + i * SLOT_W;
      const d = { ...s, cx, i, leak: 0 };
      if (s.type === 'revolve') Object.assign(d, { R: s.wide ? WIDE_R : REV_R, phi: this.rng() * TAU, stopTimer: 0, rampTimer: 0, omegaEff: 0 });
      if (s.type === 'swing') Object.assign(d, { w: 1.2, swing: 0, lastDir: 0, lastT: -9 });
      if (s.type === 'slider') Object.assign(d, { w: 1.7, open: 0, hold: 0 });
      if (s.type === 'gates') {
        // standard: three narrow lanes; wide aisles: two lanes wheelchairs, prams and bikes fit through
        const xs = s.wide ? [-0.75, 0.75] : [-1, 0, 1], hw = s.wide ? 0.46 : 0.34;
        const start = s.flow === 'out' ? -1 : 1;
        d.gl = xs.map((x, k) => ({ x: cx + x, hw, k, dir: s.flow === 'in' ? 1 : s.flow === 'out' ? -1 : (k % 2 ? -start : start), auto: s.flow === 'auto', user: null, open: 0, switchT: 0 }));
        d.cabs = s.wide ? [-1.5, 0, 1.5] : [-1.5, -0.5, 0.5, 1.5];
        d.cabHalf = s.wide ? 0.29 : 0.16;
        d.w = xs.length * hw * 2;
        d.tidalT = 0;
      }
      return d;
    });
    this.site = cfg.site || {};
    this.obs = [...(this.site.obstacles || [])];
    // door options that put things in the crowd's way: a pillar inside the exit, lane barriers through the door
    for (const d of this.doors) {
      if (d.type === 'wall') continue;
      if (d.pillar) { d.pil = { kind: 'circle', x: d.cx, y: (d.type === 'revolve' ? d.R * 0.5 : 0) + 1.5, r: 0.2, tag: 'pillar', item: true }; this.obs.push(d.pil); }
      if (d.type === 'gates') for (const b of d.cabs) this.obs.push({ kind: 'rect', x0: d.cx + b - d.cabHalf, x1: d.cx + b + d.cabHalf, y0: -0.5, y1: 0.5, tag: 'gatecab', item: true });
      if (d.lanes && d.type !== 'revolve' && d.type !== 'gates') {
        d.laned = true;
        this.obs.push({ kind: 'rect', x0: d.cx - 0.035, x1: d.cx + 0.035, y0: -1.4, y1: -0.07, tag: 'lane', item: true });
        this.obs.push({ kind: 'rect', x0: d.cx - 0.035, x1: d.cx + 0.035, y0: 0.07, y1: 1.4, tag: 'lane', item: true });
      }
    }
    // street furniture in front of a door makes people prefer another one
    for (const d of this.doors) {
      d.pen = { 1: 0, '-1': 0 };
      for (const o of this.obs) {
        if (o.item) continue;   // your own pillars and barriers don't put people off
        const ox = o.kind === 'rect' ? (o.x0 + o.x1) / 2 : o.x, oy = o.kind === 'rect' ? (o.y0 + o.y1) / 2 : o.y;
        const half = o.kind === 'rect' ? (o.x1 - o.x0) / 2 : o.r;
        if (Math.abs(ox - d.cx) < 1.1 + half && Math.abs(oy) < 1.9) d.pen[oy < 0 ? 1 : -1] += o.kind === 'rect' ? 1.2 : 0.6;
      }
    }
    this.surgeT = 0;
    this.people = [];
    this.t = 0; this.temp = 21; this.minTemp = 21; this.maxTemp = 21;
    this.stats = { through: 0, bumps: 0, laps: 0, stops: 0, turnedAway: 0, accessFail: 0, bikeFail: 0, spawned: 0, evac: null };
    this.alarm = false;
    this.events = [];
    this.acc = { in: this.rng(), out: this.rng() };
  }

  doorFits(d, p) {
    if (d.type === 'wall') return false;
    if (this.alarm) return true;   // in a fire every door is an exit
    const g = GUEST[p.type];
    if (d.type === 'gates') {
      if (!d.gl.some(l => l.auto || l.dir === p.dir)) return false;
      if ((g.stepfree || g.noRevolve) && !d.wide) return false;   // wheelchairs, prams and bikes need the wide aisles
      if (g.stepfree && this.site.rampBays && !this.site.rampBays.includes(d.i)) return false;
      return true;
    }
    if ((d.flow === 'in' && p.dir < 0) || (d.flow === 'out' && p.dir > 0)) return false;
    if (g.stepfree) {
      if (this.site.rampBays && !this.site.rampBays.includes(d.i)) return false;   // steps everywhere but the ramp
      return d.type === 'slider' || (d.type === 'revolve' && d.wide && d.wings <= 3);
    }
    if (g.noRevolve && d.type === 'revolve') return false;
    if (d.type === 'slider' && d.button) return false;   // push-button door: step-free guests only
    return true;
  }
  queueAt(d, dir) { let q = 0; for (const p of this.people) if (p.door === d.i && p.state === 'approach' && p.dir === dir) q++; return q; }
  chooseDoor(p) {
    let best = -1, bs = 1e9;
    for (const d of this.doors) {
      if (!this.doorFits(d, p)) continue;
      const s = this.alarm ? Math.abs(p.x - d.cx) + 0.35 * this.queueAt(d, p.dir)
        : Math.abs(p.x - d.cx) + (this.cfg.signs ? 1.1 : 0.45) * this.queueAt(d, p.dir) + (d.type === 'revolve' ? 0 : 0.3) + d.pen[p.dir];
      if (s < bs) { bs = s; best = d.i; }
    }
    return best;
  }

  spawn(dir, atX) {
    const m = this.cfg.crowd.mix || {};
    const u = this.rng();
    let type = 'normal', acc = 0;
    for (const k of MIX_TYPES) { acc += m[k] || 0; if (u < acc) { type = k; break; } }
    if (m.bike && !this.bikeSeen && this.stats.spawned === 5) type = 'bike';
    if (type === 'bike') this.bikeSeen = true;
    // step-free jobs always see at least one wheelchair user early, so a design can't pass by luck
    if (m.wheel && !this.wheelSeen && this.stats.spawned === 3) type = 'wheel';
    if (type === 'wheel') this.wheelSeen = true;
    const g = GUEST[type];
    const lerp = (a, t) => a[0] + (a[1] - a[0]) * t;
    let x = (this.rng() * 2 - 1) * (this.HW - 0.4);
    const si = this.site.spawnIn;
    if (atX != null) x = atX;
    else if (dir > 0 && si && this.rng() < si.p) x = si.x + (this.rng() * 2 - 1) * si.spread;   // e.g. a taxi rank at one end
    x = Math.max(-this.HW + 0.4, Math.min(this.HW - 0.4, x));
    const y = -dir * (this.HH + 0.3);
    for (const q of this.people) if ((q.x - x) ** 2 + (q.y - y) ** 2 < 0.36) return false;
    // umbrellas: people on the street are wider and a little slower; they fold them at the door
    const rain = this.cfg.rain && dir > 0 ? 1 : 0;
    const p = { x, y, vx: 0, vy: dir * 0.8, dir, type, r: lerp(g.r, this.rng()) + rain * 0.07, walk: lerp(g.walk, this.rng()) * (1 - rain * 0.08), umbrella: !!rain,
      reactBase: g.react, state: 'approach', react: null, accum: 0, lastA: 0, laps: 0, touch: 0, touchNow: 0,
      flash: 0, rechoose: 0, born: this.t };
    p.door = this.chooseDoor(p);
    this.stats.spawned++;
    if (p.door < 0) { this.stats.turnedAway++; if (g.stepfree) this.stats.accessFail++; if (type === 'bike') this.stats.bikeFail++; this.events.push({ type: 'away', who: type, x: Math.max(-this.HW + 1.2, Math.min(this.HW - 1.2, x)), y: -dir * (this.HH - 0.9), t: this.t }); return true; }
    if (this.queueAt(this.doors[p.door], dir) > 22) { this.stats.turnedAway++; return true; }
    this.people.push(p);
    return true;
  }

  step(dt) {
    const c = this.cfg;
    this.t += dt;
    if (this.t < c.duration) {
      // a station's rush comes in phases: the morning pours in, then trains empty out
      const ph = c.crowd.phases ? (c.crowd.phases.find(f => this.t < f.until) || c.crowd.phases[c.crowd.phases.length - 1]) : c.crowd;
      this.phase = c.crowd.phases ? c.crowd.phases.indexOf(ph) : null;
      for (const [k, dir] of [['in', 1], ['out', -1]]) {
        this.acc[k] += (ph[k] || 0) * dt;
        if (this.acc[k] >= 1) { if (this.spawn(dir)) this.acc[k] -= 1 + (this.rng() - 0.5) * 0.7; else this.acc[k] -= 0.2; }
      }
      // a train pulls in and its passengers come up the escalators
      const tr = this.site.trains;
      if (tr && this.t >= tr.from) {
        this.trainT = (this.trainT == null ? tr.every - 0.5 : this.trainT) + dt;
        if (this.trainT >= tr.every) {
          this.trainT -= tr.every;
          this.trainPending = (this.trainPending || 0) + tr.n;
          this.events.push({ type: 'train', x: 0, y: this.HH - 0.6, t: this.t });
        }
      }
      // passengers step off the escalators one after another
      if (this.trainPending > 0) {
        this.trainCool = (this.trainCool || 0) - dt;
        if (this.trainCool <= 0) {
          const ex = tr.xs[Math.floor(this.rng() * tr.xs.length)];
          if (this.spawn(-1, ex + (this.rng() - 0.5) * 1.4)) { this.trainPending--; this.trainCool = 0.12; } else this.trainCool = 0.05;
        }
      }
      // a bus pulls up and drops a crowd at the stop
      const sg = this.site.surge;
      if (sg && !(sg.until && this.t > sg.until)) {
        this.surgeT += dt;
        if (this.surgeT >= sg.every) {
          this.surgeT -= sg.every;
          for (let i = 0; i < sg.n; i++) this.spawn(1, sg.x + (i - (sg.n - 1) / 2) * (sg.spread / Math.max(1, sg.n - 1)) * 2);
          this.events.push({ type: 'bus', x: sg.x, y: -this.HH + 0.6, t: this.t });
        }
      }
    }
    if (c.drill && !this.alarm && this.t >= c.drill.at) this.startAlarm();
    // doors
    let leakSum = 0;
    for (const d of this.doors) {
      if (this.alarm) {
        // fire alarm: revolving doors book-fold flat, swing doors are held, sliders fail open
        if (d.type === 'revolve') { d.folded = true; d.omegaEff = 0; }
        if (d.type === 'slider') d.open = 1;
        if (d.type === 'swing') d.swing = 1;
        if (d.type === 'gates') for (const l of d.gl) l.open = 1;
        d.leak = 0;
        // a crush at the doorway arches and jams for a moment; fewer people pressing, fewer jams
        if (d.type !== 'wall') {
          d.jamT = Math.max(0, (d.jamT || 0) - dt);
          d.passT = Math.max(0, (d.passT || 0) - dt);
          // pressure on the doorway: the people right at it, plus the push of the crowd behind them.
          // A pillar in front takes most of that push (that's why it helps).
          let near = 0, behind = 0;
          const px = d.cx, py = 0.1;
          for (const p of this.people) {
            if (p.state !== 'approach' || p.y <= -0.05 || p.y > 2.6) continue;
            const dx = p.x - px, dy = p.y - py, r2 = dx * dx + dy * dy;
            if (r2 < 0.9 * 0.9) near++; else if (r2 < 2.3 * 2.3) behind++;
          }
          const press = near + behind * 0.5 * (d.pil ? 0.2 : 1);
          d.press = press;
          d.coolT = Math.max(0, (d.coolT || 0) - dt);
          // jams get sharply worse as the push builds: more often and longer
          const over = press - 5;
          if (d.jamT <= 0 && d.coolT <= 0 && over > 0 && this.rng() < dt * Math.min(3, 0.12 * over * over)) {
            d.jamT = (0.3 + 0.08 * over) * (0.7 + this.rng() * 0.6); d.coolT = d.jamT + 0.3;
            this.stats.jams = (this.stats.jams || 0) + 1;
            this.events.push({ type: 'jam', x: d.cx, y: 0.5, t: this.t });
          }
        }
        continue;
      }
      if (d.type === 'revolve') {
        let set = d.rpm * TAU / 60;
        if (d.sensor) {
          // presence sensing: drop to the slowest guest's safe tip speed while they're inside
          let lim = Infinity;
          for (const p of this.people) if (p.door === d.i && p.state === 'in') {
            const sf = GUEST[p.type].safe;
            if (sf < 1) lim = Math.min(lim, (V_SAFE + (d.padded ? 0.3 : 0)) * sf * 0.9 / d.R);
          }
          set = Math.min(set, lim);
        }
        if (d.stopTimer > 0) { d.stopTimer -= dt; d.omegaEff = 0; if (d.stopTimer <= 0) d.rampTimer = c.brakes ? 0.3 : 0.8; }
        else if (d.rampTimer > 0) { d.rampTimer -= dt; d.omegaEff = set * (1 - Math.max(0, d.rampTimer) / (c.brakes ? 0.3 : 0.8)); }
        else d.omegaEff = set;
        d.phi = modT(d.phi + d.omegaEff * dt);
        const N = d.wings, S = TAU / N, th = d.mouth * Math.PI / 180;
        let lk = 0;
        for (let k = 0; k < N; k++) {
          const s0 = d.phi + k * S;
          lk = Math.max(lk, Math.min(arcOverlap(s0, S, -Math.PI / 2 - th, 2 * th).len, arcOverlap(s0, S, Math.PI / 2 - th, 2 * th).len));
        }
        // wind forces air through wide mouths even when the wings seal
        const wind = (c.wind || 0) + (c.stack || 0) * 1.5;
        d.leak = lk * 1.0 + wind * Math.max(0, d.mouth - 30) / 40 * 0.12 * (c.seals ? 0.15 : 1);
      } else if (d.type === 'slider') {
        let want = false;
        for (const p of this.people) {
          if ((d.button || c.radar) && p.door !== d.i) continue;   // radar ignores passers-by
          const near = (p.door === d.i && p.state === 'approach') ? (Math.abs(p.x - d.cx) < 1.6 && Math.abs(p.y) < 1.7) : (Math.abs(p.x - d.cx) < 1.2 && Math.abs(p.y) < 0.9);
          if (near) { want = true; break; }
        }
        if (want) d.hold = c.radar ? 0.35 : 1.4; else d.hold -= dt;
        d.open = Math.max(0, Math.min(1, d.open + (d.hold > 0 ? (c.express ? 3.5 : 1.4) : (c.express ? -2.2 : -0.9)) * dt));
        d.leak = d.open * 0.07 * (d.curtain ? 0.3 : 1) * (d.vestibule ? 0.12 : 1) * (1 + (c.wind || 0) + (c.stack || 0) * 2);
      } else if (d.type === 'swing') {
        let busy = false;
        for (const p of this.people) if (Math.abs(p.x - d.cx) < 0.9 && Math.abs(p.y) < 0.7) { busy = true; break; }
        d.swing = Math.max(0, Math.min(1, d.swing + (busy ? 4 : -1.5) * dt));
        if (c.stack && !d.vestibule) d.swing = Math.max(d.swing, 0.3 * c.stack);   // the draught holds it ajar
        d.leak = d.swing * 0.08 * (d.curtain ? 0.3 : 1) * (d.vestibule ? 0.12 : 1) * (1 + (c.wind || 0) + (c.stack || 0) * 2);
      } else if (d.type === 'gates') {
        // tidal flow: auto lanes turn to face whichever way the queue is heavier
        const autos = d.gl.filter(l => l.auto);
        if (autos.length) {
          d.tidalT -= dt;
          if (d.tidalT <= 0) {
            d.tidalT = 1;
            const qi = this.queueAt(d, 1), qo = this.queueAt(d, -1), n = autos.length;
            let nin = qi + qo === 0 ? Math.ceil(n / 2) : Math.round(n * qi / (qi + qo));
            if (qi > 0 && nin === 0) nin = 1;
            if (qo > 0 && nin === n && n > 1) nin = n - 1;
            autos.forEach((l, k) => { const want = k < nin ? 1 : -1; if (l.dir !== want && !l.user && l.switchT <= 0) { l.dir = want; l.switchT = 1.0; } });
          }
        }
        for (const l of d.gl) {
          // the lane is free: whoever is right at the paddle taps in next
          if (!l.user && l.switchT <= 0) {
            let nb = null, ny = 9;
            for (const p of this.people) {
              if (p.state !== 'approach' || !p.lane || p.lane.l !== l || p.dir !== l.dir) continue;
              const ay = -p.y * p.dir;   // distance in front of the paddle
              if (ay > -0.12 && ay < 0.9 && Math.abs(p.x - l.x) < 0.32 && ay < ny) { ny = ay; nb = p; }
            }
            if (nb) { l.user = nb; nb.tapT = TAP[nb.type] * (d.doorman ? 0.6 : 1) * (0.85 + this.rng() * 0.3); }
          }
          l.switchT = Math.max(0, l.switchT - dt);
          if (l.user && (l.user.state === 'after' || l.user.dead)) l.user = null;

    if (this.cfg.rain) for (const p of this.people) {

  // how long it took 9 in 10 people to get through, from arriving to clearing the doors
  waitP90() {
    const w = (this.waits || []).slice().sort((a, b) => a - b);

    return w[Math.min(w.length - 1, Math.floor(w.length * 0.9))];
  }

  startAlarm() {

  buildSegments() {
    const gaps = [];

      else if (d.type === 'revolve') gaps.push([d.cx - d.R, d.cx + d.R]);
      else if (d.type === 'swing') gaps.push([d.cx - d.w / 2, d.cx + d.w / 2]);

  steer(p, dt) {

        const bx0 = (o.kind === 'rect' ? o.x0 : o.x - o.r) - m, bx1 = (o.kind === 'rect' ? o.x1 : o.x + o.r) + m;
        const by0 = (o.kind === 'rect' ? o.y0 : o.y - o.r) - m, by1 = (o.kind === 'rect' ? o.y1 : o.y + o.r) + m;

        const cx0 = bx0 + 0.12, cx1 = bx1 - 0.12;
        if (!segHitsBox(p.x, p.y, tx, ty, cx0, by0 + 0.12, cx1, by1 - 0.12)) continue;
        const ox0 = o.kind === 'rect' ? o.x0 : o.x - o.r, ox1 = o.kind === 'rect' ? o.x1 : o.x + o.r;
        const oy0 = o.kind === 'rect' ? o.y0 : o.y - o.r, oy1 = o.kind === 'rect' ? o.y1 : o.y + o.r;
        if (tx >= ox0 && tx <= ox1 && ty >= oy0 && ty <= oy1) continue;            // the target is inside it: nothing to route round
        const goLeft = Math.abs(p.x - bx0) + Math.abs(tx - bx0) <= Math.abs(p.x - bx1) + Math.abs(tx - bx1);
        const inBand = p.y > by0 && p.y < by1;

      for (const o of this.obs) {

    p.x += p.vx * dt; p.y += p.vy * dt;

  collide(dt) {

    for (const p of people) p.touchNow = 0;
    // blade directions are fixed within a step: compute them once
    for (const d of this.doors) if (d.type === 'revolve') {
      const S = TAU / d.wings;
      d.bc = d.bc && d.bc.length === d.wings ? d.bc : new Float64Array(d.wings);
      d.bs = d.bs && d.bs.length === d.wings ? d.bs : new Float64Array(d.wings);
      for (let k = 0; k < d.wings; k++) { d.bc[k] = Math.cos(d.phi + k * S); d.bs[k] = Math.sin(d.phi + k * S); }

    const cell = 0.6, x0 = -this.HW - 1.5, y0 = -this.HH - 3.5;
    const gw = Math.ceil((this.HW * 2 + 3) / cell) + 1, gh = Math.ceil((this.HH * 2 + 7) / cell) + 1;
    if (!this.gHead || this.gHead.length !== gw * gh) this.gHead = new Int32Array(gw * gh);
    if (!this.gNext || this.gNext.length < n) this.gNext = new Int32Array(Math.max(64, n * 2));
    const head = this.gHead, next = this.gNext;
    if (!this.gCx || this.gCx.length < n) { this.gCx = new Int32Array(Math.max(64, n * 2)); this.gCy = new Int32Array(Math.max(64, n * 2)); }
    const cx = this.gCx, cy = this.gCy;
    for (let it = 0; it < 3; it++) {
      head.fill(-1);

        const p = people[i];

        gx = gx < 0 ? 0 : gx >= gw ? gw - 1 : gx; gy = gy < 0 ? 0 : gy >= gh ? gh - 1 : gy;
        cx[i] = gx; cy[i] = gy;
        const c = gy * gw + gx; next[i] = head[c]; head[c] = i;
      }
      for (let i = 0; i < n; i++) {
        const p = people[i], gx = cx[i], gy = cy[i];
        for (let oy = -1; oy <= 1; oy++) {

      for (const p of people) {
        if (p.state === 'after' || Math.abs(p.x - d.cx) > d.R + 0.6 || Math.abs(p.y) > d.R + 0.6) continue;

    }

  }

  collideRevolve(p, d, apply) {

    return maxPen;
  }

  collideStatic(p) {
    for (const o of this.obs) {
      if (o.kind === 'rect') {
        const qx = Math.max(o.x0, Math.min(o.x1, p.x)), qy = Math.max(o.y0, Math.min(o.y1, p.y));
        // inside the rectangle: push out through the nearest edge
        if (qx === p.x && qy === p.y) {
          const dl = p.x - o.x0, dr = o.x1 - p.x, db = p.y - o.y0, dt2 = o.y1 - p.y, m = Math.min(dl, dr, db, dt2);
          if (m === dl) p.x = o.x0 - p.r; else if (m === dr) p.x = o.x1 + p.r; else if (m === db) p.y = o.y0 - p.r; else p.y = o.y1 + p.r;
        } else this.pushFrom(p, qx, qy, 0, 0, 1);
      } else {
        const dx = p.x - o.x, dy = p.y - o.y, m = o.r + p.r;
        if (dx * dx + dy * dy < m * m) this.pushFrom(p, o.x, o.y, o.r, 0, p.y >= o.y ? 1 : -1);
      }
    }
    if (Math.abs(p.y) < p.r + WALL_T) for (const [a, b] of this.segs) {
      const qx = Math.max(a, Math.min(b, p.x));
      this.pushFrom(p, qx, 0, WALL_T, 0, p.y >= 0 ? 1 : -1);
    }
    if (p.x < -this.HW + p.r) { p.x = -this.HW + p.r; p.vx = Math.max(0, p.vx); }
    if (p.x > this.HW - p.r) { p.x = this.HW - p.r; p.vx = Math.min(0, p.vx); }
  }

  pushFrom(p, qx, qy, t, fnx, fny) {
    let dx = p.x - qx, dy = p.y - qy;
    const m = p.r + t, d2 = dx * dx + dy * dy;
    if (d2 >= m * m) return;
    let d = Math.sqrt(d2);
    let nx, ny;
    if (d < 1e-6) { nx = fnx; ny = fny; d = 0; } else { nx = dx / d; ny = dy / d; }
    p.x += nx * (m - d); p.y += ny * (m - d);
    const vn = p.vx * nx + p.vy * ny; if (vn < 0) { p.vx -= nx * vn; p.vy -= ny * vn; }
  }
}

const PRICE = { revolve: 12000, wingExtra: 1500, bigCore: 2000, padded: 1500, sensor: 2000, wide: 8000, swing: 2500, slider: 6000, curtain: 3500, vestibule: 5000, pillar: 1500, lanes: 800, gates: 7000, gatesWide: 9000, tidal: 2500 };

function slotCost(s) {
  if (!s || s.type === 'wall') return 0;
  const extras = (s.pillar ? PRICE.pillar : 0);
  if (s.type === 'gates') return (s.wide ? PRICE.gatesWide : PRICE.gates) + (s.flow === 'auto' ? PRICE.tidal : 0);
  if (s.type === 'revolve') return extras + PRICE.revolve + (s.wide ? PRICE.wide : 0) + Math.max(0, s.wings - 3) * PRICE.wingExtra + (s.core >= 0.3 ? PRICE.bigCore : 0) + (s.padded ? PRICE.padded : 0) + (s.sensor ? PRICE.sensor : 0);
  return extras + (s.type === 'swing' ? PRICE.swing : PRICE.slider) + (s.curtain ? PRICE.curtain : 0) + (s.vestibule ? PRICE.vestibule : 0) + (s.lanes ? PRICE.lanes : 0);
}
function designCost(slots, existing) {
  let c = 0;
  slots.forEach((s, i) => {
    const old = existing && existing[i];
    if (!old || old.type !== s.type || ((s.type === 'revolve' || s.type === 'gates') && !!s.wide !== !!old.wide)) { c += slotCost(s) - (s.pillar && old && old.pillar ? PRICE.pillar : 0); return; }
    if (s.pillar && !old.pillar) c += PRICE.pillar;
    if (s.type === 'gates') { if (s.flow === 'auto' && old.flow !== 'auto') c += PRICE.tidal; return; }
    if (s.type === 'revolve') {
      c += Math.max(0, s.wings - old.wings) * PRICE.wingExtra;
      if (s.core >= 0.3 && old.core < 0.3) c += PRICE.bigCore;
      if (s.padded && !old.padded) c += PRICE.padded;
      if (s.sensor && !old.sensor) c += PRICE.sensor;
    } else {
      if (s.curtain && !old.curtain) c += PRICE.curtain;
      if (s.vestibule && !old.vestibule) c += PRICE.vestibule;
      if (s.lanes && !old.lanes) c += PRICE.lanes;

  });
  return c;
}
// a position-free fingerprint of a design, for the novelty check
function designSig(slots) {
  return slots.filter(s => s.type !== 'wall').map(s => {
    let t = s.type[0];
    if (s.flow && s.flow !== 'both') t += s.flow[0];
    if (s.type === 'gates') t += s.wide ? 'W' : '';
    if (s.type === 'revolve') t += (s.wide ? 'W' : '') + s.wings + (s.core >= 0.3 ? 'C' : '') + (s.mouth <= 32 ? 'N' : '') + (s.rpm <= 3.5 ? 'S' : '') + (s.sensor ? 'P' : '');
    if (s.button) t += 'B';
    if (s.vestibule) t += 'V';
    if (s.doorman) t += 'D';
    if (s.pillar) t += 'X';

  return false;
}

function makeContract(kindKey, tier, month, seed, opts = {}) {
  const k = KINDS[kindKey], rng = makeRng(seed * 7919 + 13), tech = opts.tech || {};

  const scale = first ? 1 : (1 + 0.1 * Math.min(tier, 6)) * (0.88 + rng() * 0.24);
  let temp = first && k.hook.temp != null ? k.hook.temp : SEASON_T[month % 12] + Math.round(rng() * 5 - 3);
  let slots = k.slots;

// ---------- running the firm ----------
// what a fitted client pays each month: worn doors pay less, broken ones nothing; green stars and certificates pay more
const wearFactor = p => p.broken ? 0 : (p.wear || 0) < 0.5 ? 1 : 1 - ((p.wear || 0) - 0.5) * 0.8;
const upkeep = p => Math.round((p.fee * 0.007 * p.stars + 100) * (S.staff && S.staff.engineer ? 1.4 : 1) * (p.green ? 1.15 : 1) * (p.cert ? 1.1 : 1) * wearFactor(p) / 50) * 50;
// doors wear with traffic: revolving doors and gates fastest, swing doors slowest
const WEAR = { revolve: 0.1, slider: 0.08, swing: 0.06, gates: 0.1 };
function wearRate(p) {
  const doors = (p.install || []).filter(s => s.type !== 'wall');
  if (!doors.length) return 0;
  const base = doors.reduce((a, s) => a + (WEAR[s.type] || 0.08) * (s.wide ? 1.2 : 1), 0) / doors.length;
  return base * (1 + 0.06 * Math.min(p.tier || 0, 6)) * (S.staff.engineer ? 0.5 : 1);
}
const serviceCost = p => Math.round((300 + p.fee * 0.05 * (p.wear || 0) + (p.broken ? 800 : 0)) / 50) * 50;
// insurance: a base premium plus a loading for every bump and safety stop on your record
const insurance = () => S.plots.filter(p => p.status === 'fitted' || p.status === 'callback').reduce((a, p) => a + 45 * (p.bumpRec || 0) + 25 * (p.stopRec || 0), S.jobs ? 60 : 0);
// can a wheelchair get in? (the inspector checks this at public buildings)
function stepFreeOk(p) {
  const site = buildSite(p.kind, p.install.length);
  return p.install.some((s, i) => (s.type === 'slider' || (s.type === 'revolve' && s.wide && s.wings <= 3) || (s.type === 'gates' && s.wide)) && (!site.rampBays || site.rampBays.includes(i)));
}
// an inspector re-runs an old install against today's crowd
function inspect(p) {
  const c = makeContract(p.kind, Math.min(7, Math.floor(S.jobs / 3) + (p.tier || 0)), S.month, 1 + Math.floor(Math.random() * 1e6), { plain: true, existing: p.install, tech: tech() });
  const r = runHeadless(c, p.install, tech());
  const access = ['library', 'townhall', 'station'].includes(p.kind) ? stepFreeOk(p) : true;
  const safe = r.bumps <= c.goals.bumps && r.stops <= 3;
  return { pass: safe && access, safe, access, bumps: r.bumps, limit: c.goals.bumps };
}
const monthlyIncome = () => S.plots.filter(p => p.status === 'fitted').reduce((a, p) => a + upkeep(p), 0);

const NEXT = { bays: 'doors', doors: 'run', month: 'company' };
const coachEl = { id: null, target: null };
function tutOn() { S.tut = S.tut || { done: {} }; return !S.tut.off; }
// target: an element, or a function that finds it (so the tip survives the page redrawing)
function coach(id, target) {
  if (!S.seenIntro || !tutOn() || S.tut.done[id] || coachEl.id === id) return;
  const find = typeof target === 'function' ? target : () => target;
  const el = find();
  if (!el || !el.getClientRects().length) return;
  coachEl.id = id; coachEl.target = el; coachEl.find = find;
  $('coachTitle').textContent = COACH[id][0]; $('coachText').textContent = COACH[id][1];
  $('coach').hidden = false; placeCoach();
}
function coachDone(skipAll) {
  if (!coachEl.id) return;
  const id = coachEl.id; S.tut.done[id] = true; if (skipAll) S.tut.off = true; save();
  coachEl.id = null; coachEl.target = null; $('coach').hidden = true;
  const nx = NEXT[id]; if (nx && !skipAll) setTimeout(() => coach(nx, COACH_TARGET[nx]), 120);
}
const COACH_TARGET = { doors: () => document.querySelector('#editor .seg'), run: () => $('testBtn'), company: () => $('rdBtn') };
function placeCoach() {
  let el = coachEl.target; if (!el) return;
  if (!tutOn()) { coachEl.id = null; coachEl.target = null; $('coach').hidden = true; return; }
  if (!el.isConnected && coachEl.find) { const again = coachEl.find(); if (again) el = coachEl.target = again; }
  if (!el.isConnected || !el.getClientRects().length) { $('coach').hidden = true; return; }
  $('coach').hidden = false;
  const r = el.getBoundingClientRect(), ring = $('coachRing'), bub = $('coachBubble'), pad = 6;
  ring.style.left = (r.left - pad) + 'px'; ring.style.top = (r.top - pad) + 'px'; ring.style.width = (r.width + pad * 2) + 'px'; ring.style.height = (r.height + pad * 2) + 'px';
  const bw = Math.min(320, innerWidth - 24), bh = bub.offsetHeight || 120;
  const below = r.bottom + 14 + bh < innerHeight - 8;
  bub.style.width = bw + 'px';
  bub.style.left = Math.max(12, Math.min(innerWidth - bw - 12, r.left + r.width / 2 - bw / 2)) + 'px';
  bub.style.top = (below ? r.bottom + 14 : Math.max(8, r.top - 14 - bh)) + 'px';
}

function openLesson(key, back) {

  sheet(`<div class="eyebrow">${b ? 'Guide' : 'How to use it'}</div><h3>${b ? b[1] : l[0]}</h3>

let coTab = 'research';
function openCompany(tab) {
  if (tab) coTab = tab;
  const P = prem(), broke = S.cash < 0;
  const tabs = `<div class="seg">${[['research', 'Research'], ['staff', 'Staff'], ['premises', 'Premises'], ['guide', 'Guide']].map(([k, l]) => `<button type="button" data-tab="${k}" aria-pressed="${coTab === k}">${l}</button>`).join('')}</div>`;
  let body = '';
  if (coTab === 'research') {
    const busy = S.research.length, free = P.labs - busy;
    body = `<p>${busy ? `Researching ${S.research.map(r => `<b style="color:var(--text)">${techName(r.key)}</b> (${r.left} month${r.left > 1 ? 's' : ''} left)`).join(', ')}. ` : ''}${free > 0 ? `${free} bench${free > 1 ? 'es' : ''} free.` : 'All benches busy.'} Projects finish at the end of the month.</p>` +
      BRANCHES.map(([b, label]) => `<div class="branch"><div class="eyebrow">${label}</div>${TECH.filter(t => t.branch === b).map(t => {
        const owned = S.unlocks[t.key], doing = S.research.find(r => r.key === t.key);
        const missing = (t.req || []).filter(r => !S.unlocks[r]);
        const tierOk = t.tier <= P.tier;
        let state, action = '';
        if (owned) state = LESSONS[t.key] ? `<button class="ghost small" type="button" data-lesson="${t.key}">How to use</button>` : '<span class="pill done">Owned</span>';
        else if (doing) state = `<span class="pill open">${doing.left} mo</span>`;
        else if (!tierOk) state = `<span class="pill lock">Tier ${t.tier}</span>`;
        else if (missing.length) state = `<span class="pill lock">Locked</span>`;
        else action = `<button class="go" type="button" data-k="${t.key}" ${broke || free <= 0 || S.cash < t.price ? 'disabled' : ''}>${kmoney(t.price)} · ${t.months} mo</button>`;
        const why = !owned && !doing ? (!tierOk ? `Needs ${PREMISES[t.tier - 1].name.toLowerCase()} premises. ` : missing.length ? `Needs ${missing.map(techName).join(', ')}. ` : '') : '';
        return `<div class="node ${owned ? 'owned' : doing ? 'doing' : action ? 'avail' : 'locked'}"><div><b>${t.name}</b><p>${why}${t.text}${t.opens ? `<br><span class="opens">Opens specialist jobs: ${t.opens}</span>` : ''}</p></div>${state || action}</div>`;
      }).join('')}</div>`).join('');
  } else if (coTab === 'guide') {
    const owned = TECH.filter(t => S.unlocks[t.key] && LESSONS[t.key]);
    body = `<p>Everything the game has taught you, any time you need it.</p>
      <div class="branch"><div class="eyebrow">The basics</div>${BASICS.map(([k, t]) => `<button class="lessonrow" type="button" data-lesson="${k}"><b>${t}</b><span>›</span></button>`).join('')}</div>
      <div class="branch"><div class="eyebrow">Your research</div>${owned.length ? owned.map(t => `<button class="lessonrow" type="button" data-lesson="${t.key}"><b>${t.name}</b><span>›</span></button>`).join('') : '<p class="note">Lessons for new kit appear here as your research finishes.</p>'}</div>
      <button class="ghost" type="button" id="tutReplay">Replay the walk-through</button>`;
  } else if (coTab === 'staff') {
    const hired = STAFF.filter(s => S.staff[s.key]).length;
    body = `<p>Wages come out at the end of every month. Your ${P.name.toLowerCase()} has room for ${P.staff} hire${P.staff > 1 ? 's' : ''}; ${hired} taken.</p>` +
      STAFF.map(s => {
        const on = S.staff[s.key], needs = s.req && !S.unlocks[s.req];
        const btn = on ? `<button class="ghost" type="button" data-fire="${s.key}">Let go</button>`
          : needs ? `<span class="pill lock">Research first</span>`
          : `<button class="go" type="button" data-hire="${s.key}" ${broke || hired >= P.staff ? 'disabled' : ''}>Hire</button>`;
        return `<div class="node ${on ? 'owned' : needs ? 'locked' : 'avail'}"><div><b>${s.name} · ${money(s.wage)}/mo</b><p>${needs ? `Needs ${techName(s.req)}. ` : ''}${s.text}</p></div>${btn}</div>`;
      }).join('');
  } else {
    body = `<p>Rent is due every month. Bigger premises unlock higher research tiers and room for more staff.</p>` +
      PREMISES.map((p, i) => {
        const cur = i === (S.premises || 0), past = i < (S.premises || 0), next = i === (S.premises || 0) + 1;
        const repOk = rep() >= (p.rep || 0);
        const btn = cur ? '<span class="pill done">Current</span>' : past ? '<span class="pill lock">Outgrown</span>'
          : next ? (repOk ? `<button class="go" type="button" data-move="${i}" ${broke || S.cash < p.price ? 'disabled' : ''}>Move · ${kmoney(p.price)}</button>` : `<span class="pill lock">${p.rep}★ rep</span>`)
          : '<span class="pill lock">Later</span>';
        return `<div class="node ${cur ? 'owned' : next && repOk ? 'avail' : 'locked'}"><div><b>${p.name} · ${money(p.rent)}/mo rent</b><p>${p.text} Research tier ${p.tier}, ${p.labs} bench${p.labs > 1 ? 'es' : ''}, ${p.staff} staff.</p></div>${btn}</div>`;
      }).join('');
  }
  sheet(`<div class="eyebrow">Company</div><h3>${P.name}</h3>
    <div class="facts"><div class="fact"><span>Cash</span><b class="${broke ? 'neg' : ''}">${kmoney(S.cash)}</b></div><div class="fact"><span>In / month</span><b>${kmoney(monthlyIncome())}</b></div><div class="fact"><span>Out / month</span><b>${kmoney(overheads())}</b></div></div>
    ${broke ? '<p class="note"><span class="hot">You\'re overdrawn.</span> You can\'t start research, hire or move until you\'re back in the black.</p>' : ''}
    ${tabs}${body}
    <div style="display:flex;gap:8px"><button class="ghost" type="button" id="coNew" style="flex:1">Start a new firm</button><button class="ghost" type="button" id="coClose" style="flex:1">Close</button></div>`);
  const sh = $('sheet');
  sh.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { const top = sh.scrollTop; openCompany(b.dataset.tab); sh.scrollTop = 0; });
  sh.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
    const t = TECH.find(x => x.key === b.dataset.k);
    if (S.cash < t.price || S.research.length >= prem().labs) return;
    S.cash -= t.price; S.research.push({ key: t.key, left: t.months }); save(); renderStreet(); keepScroll(() => openCompany()); toast(`Started ${t.name} · ready in ${t.months} month${t.months > 1 ? 's' : ''}`);
  });
  sh.querySelectorAll('[data-hire]').forEach(b => b.onclick = () => { S.staff[b.dataset.hire] = true; save(); renderStreet(); keepScroll(() => openCompany()); toast(`${STAFF.find(s => s.key === b.dataset.hire).name} hired`); });
  sh.querySelectorAll('[data-fire]').forEach(b => b.onclick = () => { S.staff[b.dataset.fire] = false; save(); renderStreet(); keepScroll(() => openCompany()); });
  sh.querySelectorAll('[data-move]').forEach(b => b.onclick = () => {
    const i = +b.dataset.move, p = PREMISES[i];
    if (S.cash < p.price) return;
    S.cash -= p.price; S.premises = i; save(); renderStreet(); keepScroll(() => openCompany()); toast(`Moved into the ${p.name.toLowerCase()}`);
  });
  $('coClose').onclick = closeSheet;
  sh.querySelectorAll('[data-lesson]').forEach(b => b.onclick = () => openLesson(b.dataset.lesson, () => openCompany()));
  if ($('tutReplay')) $('tutReplay').onclick = () => { S.tut = { done: {} }; save(); closeSheet(); toast('Walk-through on: it picks up as you play'); setTimeout(renderStreet, 300); };
  // starting over wipes the save, so it takes two taps
  $('coNew').onclick = () => {
    const btn = $('coNew');
    if (!btn.classList.contains('armed')) {
      btn.classList.add('armed'); btn.textContent = 'Tap again: lose everything';
      clearTimeout(btn._t); btn._t = setTimeout(() => { if (btn.isConnected) { btn.classList.remove('armed'); btn.textContent = 'Start a new firm'; } }, 3000);
      return;
    }
    try { localStorage.setItem(KEY, JSON.stringify(fresh())); } catch (e) {}
    location.reload();
  };
}
// a fitted client: what they pay, how worn the doors are, their safety record

$('monthBtn').onclick = guarded(() => {
  const inc = monthlyIncome(), rent = prem().rent, ins = insurance();
  const wages = STAFF.filter(s => S.staff[s.key]);
  const wageTotal = wages.reduce((a, s) => a + s.wage, 0);
  S.cash += inc - rent - wageTotal - ins;
  // claims: someone clipped by one of your doors sues; you pay the excess
  const claims = [];
  for (const p of S.plots) if (p.status === 'fitted' && p.bumpRec > 0 && Math.random() < Math.min(0.15, 0.02 * p.bumpRec)) { claims.push(p); S.cash -= 1200; }
  // wear: doors age every month, and break down at the end of their tether
  const broke = [];
  for (const p of S.plots) {
    if (p.status !== 'fitted' || p.broken) continue;
    p.wear = Math.min(1, (p.wear || 0) + wearRate(p));
    if (p.wear >= 1) { p.broken = true; broke.push(p); }
  }
  // now and then an inspector turns up at one of your old jobs
  let insp = null;
  const due = S.plots.filter(p => p.status === 'fitted' && p.install && !p.cert && (S.month - (p.inspected || -99)) >= 6);
  if (due.length && Math.random() < 0.15) {
    const p = due[Math.floor(Math.random() * due.length)];
    p.inspected = S.month + 1;
    try {
      const res = inspect(p);
      insp = { p, ...res };
      if (res.pass) p.cert = true;
      else { S.cash -= 2500; p.status = 'callback'; p.reason = res.access ? 'safety' : 'access'; p.contract = null; p.tier++; }
    } catch (e) { insp = null; }
  }
  S.month++; if (S.month % 12 === 0) S.year++;
  // research
  const done = [];
  for (const r of S.research) { r.left--; if (r.left <= 0) { S.unlocks[r.key] = true; done.push(r.key); } }
  S.research = S.research.filter(r => r.left > 0);
  // deep in the red: the crew walks
  let walked = [];
  if (S.cash < -15000) { walked = wages.map(s => s.name); S.staff = {}; }
  const winter = [10, 11, 0, 1].includes(S.month % 12);
  const calls = [];
  for (const p of S.plots) {
    if (p.status !== 'fitted' || p.broken) continue;
    const chance = (winter ? 0.32 : 0.2) + (p.wear || 0) * 0.15;   // tired doors get more complaints
    if (Math.random() < chance) {
      const opts = winter ? ['cold', 'cold', 'busier', 'older'] : ['busier', 'older', 'cold'];
      p.reason = opts[Math.floor(Math.random() * opts.length)];
      if (p.reason === 'cold' && (eventOf(S.month) || {}).key === 'heatwave') p.reason = 'hot';
      p.status = 'callback'; p.tier++; p.contract = null;
      calls.push(p);
    }
  }
  // Brassworks bids on tenders you've left sitting
  const lost = [];
  if (rivalActive()) for (const p of S.plots) {
    if (p.status !== 'open' || !p.contract || p.contract.first || p.contract.landmark || !p.contract.solved) continue;
    if (Math.random() < 0.18) { p.status = 'rival'; p.rivalUntil = S.month + 3 + Math.floor(Math.random() * 3); p.contract = null; lost.push(p); }
  }
  // stale tenders refresh with the season; new tech means new kinds of tender
  const evNow = eventOf(S.month), evKey = evNow ? evNow.key : null;
  for (const p of S.plots) {
    if (!p.contract || (p.status !== 'open' && p.status !== 'callback')) continue;
    const wantEv = p.contract.first ? null : evKey;   // a new month's event replaces last month's tenders
    if ((p.contract.event || null) !== wantEv || (p.status === 'open' && (done.length || Math.random() < 0.35))) p.contract = null;
  }
  renderStreet();
  const net = inc - rent - wageTotal - ins - claims.length * 1200 - (insp && !insp.pass ? 2500 : 0);
  sheet(`<div class="eyebrow">${MONTHS[S.month % 12]} ${S.year}</div><h3>${net >= 0 ? 'Up ' + money(net) : 'Down ' + money(-net)} this month</h3>
    <ul class="list">
      <li class="pass"><span>Maintenance fees</span><span>+${money(inc)}</span></li>
      <li><span>Rent · ${prem().name.toLowerCase()}</span><span>−${money(rent)}</span></li>
      ${wages.map(s => `<li><span>${s.name}</span><span>−${money(s.wage)}</span></li>`).join('')}
      ${ins ? `<li><span>Insurance${ins > 60 ? ' · loaded for bumps on your record' : ''}</span><span>−${money(ins)}</span></li>` : ''}
      ${claims.map(p => `<li class="fail"><span>Claim: someone clipped at ${p.name}</span><span>−${money(1200)}</span></li>`).join('')}
      ${insp && !insp.pass ? `<li class="fail"><span>Inspection fine · ${insp.p.name}</span><span>−${money(2500)}</span></li>` : ''}
      <li><span><b>Cash now</b></span><span class="${S.cash < 0 ? 'neg' : ''}">${money(S.cash)}</span></li>
    </ul>
    ${insp ? `<p><strong style="color:${insp.pass ? 'var(--ok)' : 'var(--warn)'}">Inspection at ${insp.p.name}:</strong> ${insp.pass ? 'passed. They get a certificate of compliance, and pay you 10% more maintenance.' : !insp.access ? 'failed. There is no step-free way in. You have a callback to fix it.' : `failed on safety: ${insp.bumps} people clipped, the limit is ${insp.limit}. You have a callback to fix it.`}</p>` : ''}
    ${lost.length ? `<p><span class="hot">${RIVAL} won ${lost.map(p => p.name).join(' and ')}.</span> Tenders you leave sitting are fair game. Their work rarely lasts: expect the client back.</p>` : ''}
    ${broke.length ? `<p><span class="hot">Broken down:</span> ${broke.map(p => p.name).join(', ')}. No maintenance fee until you send someone. Tap the building on the street to service it.</p>` : ''}
    ${done.length ? `<p><strong style="color:var(--brass)">Research complete:</strong> ${done.map(techName).join(', ')}.${done.some(k => TECH.find(t => t.key === k).opens) ? ' New specialist tenders may appear.' : ''}</p>
      <div class="learn">${done.filter(k => LESSONS[k]).map(k => `<button class="ghost small" type="button" data-lesson="${k}">How to use ${techName(k)}</button>`).join('')}</div>` : ''}
    ${walked.length ? `<p><span class="hot">Your staff walked out</span> over unpaid wages: ${walked.join(', ')}.</p>` : S.cash < 0 ? '<p><span class="hot">You\'re overdrawn.</span> Win jobs or let staff go. Below −£15k your crew will walk out.</p>' : ''}
    <p>${calls.length ? 'Clients on the phone:' : inc ? 'Every fitted client is happy.' : 'Win a tender to start earning maintenance fees.'}</p>

function evaluateTest() {
  const c = W.contract, g = c.goals, r = { ...W.world.stats, minTemp: W.world.minTemp, maxTemp: W.world.maxTemp, wait: W.world.waitP90() };
  if (c.drill && r.evac == null) r.evac = null;
  const cost = designCost(W.design, c.existing);
  const rows = [
    ['Through', r.through, `≥ ${g.through}`, r.through >= g.through],
    ['Bumps', r.bumps, `≤ ${g.bumps}`, r.bumps <= g.bumps],
  ];
  if (g.minTemp != null) rows.push(['Coldest lobby', r.minTemp.toFixed(1) + '°', `≥ ${g.minTemp}°`, r.minTemp >= g.minTemp]);
  if (g.wait != null) rows.push(['9 in 10 through within', r.wait.toFixed(1) + 's', `≤ ${g.wait}s`, r.wait <= g.wait]);
  if (g.maxTemp != null) rows.push(['Hottest lobby', r.maxTemp.toFixed(1) + '°', `≤ ${g.maxTemp}°`, r.maxTemp <= g.maxTemp]);
  if (g.access) rows.push(['Wheelchairs and prams turned away', r.accessFail, '0', r.accessFail === 0]);
  if (g.bikes) rows.push(['Cyclists turned away', r.bikeFail, '0', r.bikeFail === 0]);
  if (g.laps != null) rows.push(['Went round again', r.laps, `≤ ${g.laps}`, r.laps <= g.laps]);
  if (c.drill) rows.push(['Fire drill: lobby cleared in', r.evac == null ? 'not cleared' : r.evac.toFixed(1) + 's', `≤ ${g.evac}s`, r.evac != null && r.evac <= g.evac]);
  if (violatesRules(c, W.design)) rows.push(['Client rules', 'broken', c.rules.forbid ? 'no ' + c.rules.forbid.join(', ') + ' doors' : 'listed door', false]);
  rows.push(['Cost', money(cost), `≤ ${money(c.budget)}`, cost <= c.budget]);
  if (g.laps == null) rows.push(['Went round again', r.laps, '', null]);
  rows.push(['Safety stops', r.stops, '', null]);
  const pass = rows.every(x => x[3] !== false);
  let stars = 0;
  if (pass) { stars = 1; if (cost <= c.par.cost) { stars = 2; if (r.bumps === 0 && r.stops === 0) stars = 3; } }
  W.mode = 'result'; W.passed = pass; W.stars = stars; W.cost = cost;
  const hint = pass ? '' : !rows[0][3] ? 'Not enough got through. More doors, faster wings, or wider mouths.'
    : !rows[1][3] ? 'Too many bumps. Slow the wings so the tips stay under the safe speed, or give swing doors a direction.'
    : (g.wait != null && r.wait > g.wait) ? 'The queues at the gates are too long. Each lane takes one person at a time, so point more lanes the busy way (Auto lanes follow the rush), and gate-line staff help people tap through faster.'
    : (g.maxTemp != null && r.maxTemp > g.maxTemp) ? 'The lobby got too hot. Every open door lets the heat in, just as it lets the cold in during winter. Revolving doors seal; air curtains help.'
    : (g.minTemp != null && r.minTemp < g.minTemp) ? 'The lobby got too cold. Swing and sliding doors leak; revolving doors with enough wings seal.'
    : (g.access && r.accessFail) ? `Wheelchairs and prams need a sliding door they can reach${S.unlocks.wide ? ', or a wide drum with 3 wings or fewer' : ''}${c.site && c.site.rampBays ? ` in a bay with the ramp (bay ${c.site.rampBays.map(i => i + 1).join(', ')})` : ''}.`
    : (g.bikes && r.bikeFail) ? 'Cyclists can\'t wheel a bike through a revolving door. Give them a swing or sliding door that isn\'t push-button only.'
    : violatesRules(c, W.design) ? 'The client\'s rules forbid one of your doors. Swap it out.'
    : (c.drill && !(r.evac != null && r.evac <= g.evac)) ? 'The lobby took too long to empty. More or wider exits help, and a pillar just inside a busy exit stops the crowd jamming in the doorway.'
    : (g.laps != null && r.laps > g.laps) ? 'People near the slow hub are missing their exit and riding round again. A bigger core keeps them on the fast outer ring.' : 'Over budget.';
  sheet(`<div class="stars">${[0, 1, 2].map(i => `<span class="${i < stars ? '' : 'off'}">★</span>`).join('')}</div>

const COATS = { 1: ['#9cc4ec', '#86b2de', '#b3d2f0'], '-1': ['#e79a86', '#d98670', '#f0b2a2'] };

// ---------- loop ----------
let prev = performance.now(), acc = 0, hudT = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - prev) / 1000); prev = now;
  if (W) {
    const h = SIM_DT;
    if (W.mode === 'test') {
      acc += dt * (S.speed || 3);
      let n = 0;
      // step count must match the surveyor's exactly, so the same design gives the same result
      const total = Math.round(runSeconds(W.contract) / h);
      W.steps = W.steps || 0;
      while (acc >= h && n < 80 && W.steps < total && !testOver(W.contract, W.world)) { W.world.step(h); W.steps++; acc -= h; n++; }
      if (n >= 80) acc = 0;
      for (const e of W.world.events) if (e.t > W.lastEvT) W.fx.push({ ...e, t0: now / 1000 });
      if (W.world.events.length) W.lastEvT = W.world.events[W.world.events.length - 1].t;
      if (W.steps >= total || testOver(W.contract, W.world)) {
        // let the "lobby clear" moment show for a beat before the results
        W.endHold = (W.endHold || 0) + dt;
        if (W.steps >= total || W.endHold > 1.2) { W.endHold = 0; evaluateTest(); updateHud(); }
      }
    } else if (W.mode === 'design') {
      acc += dt; while (acc >= h) { W.world.step(h); acc -= h; }
    }
    draw(now / 1000);
    if (coachEl.id) placeCoach();
    hudT += dt; if (hudT > 0.15) { hudT = 0; updateHud(); }
  }
  if (!W && coachEl.id) placeCoach();
  requestAnimationFrame(frame);
}

})();

if (!S.seenIntro) {
  sheet(`<div class="eyebrow">Prototype</div><h3>Door Duty Contractors</h3>
    <p>You run a small firm that fits entrances on the High Street. Every shop that hires you is a puzzle: design its frontage, test it in a 40-second rush hour, and sign it off if the client is happy.</p>
    <p>Revolving doors seal out the cold, but their wing tips move at v = ω·r and bump people if you spin them too fast. Swing and sliding doors are cheap and quick but leak heat. Fitted clients pay maintenance every month, and sometimes call you back when things change.</p>
    <div style="display:flex;gap:8px"><button class="ghost" type="button" id="iSkip">I know the trade</button><button class="go" type="button" id="iGo">Show me around</button></div>`);
  $('iGo').onclick = () => { S.seenIntro = true; S.tut = { done: {} }; save(); closeSheet(); renderStreet(); };
  $('iSkip').onclick = () => { S.seenIntro = true; S.tut = { done: {}, off: true }; save(); closeSheet(); };
  // however the intro is dismissed, it only shows once
  $('sheetWrap').addEventListener('click', e => { if (e.target === $('sheetWrap') && !S.seenIntro) { S.seenIntro = true; S.tut = S.tut || { done: {} }; save(); setTimeout(renderStreet, 50); } });
}
$('coachOk').onclick = () => coachDone();
$('coachSkip').onclick = () => coachDone(true);
addEventListener('resize', () => coachEl.id && placeCoach());
requestAnimationFrame(frame);
})();

</script>
